name: Windows USB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-usb.yml"
      - "Start-Kamera.cmd"
      - "local/**"
      - "transfer-*.js"
      - "tests/*.test.js"
      - "tests/windows/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adapter, Server und Einzelübertragung prüfen
        run: node --test tests/gphoto.test.js tests/local-server.test.js tests/transfer-engine.test.js tests/windows-iso.test.js
      - name: Nativen Windows-Leser kompilieren und Sony-Datenformat prüfen
        shell: pwsh
        run: |
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /noconfig /codepage:65001 /platform:x64 /reference:System.dll /reference:System.Core.dll "/out:$env:RUNNER_TEMP\SonyIso.exe" local/windows/Program.cs local/windows/Wpd.cs local/windows/SonyIso.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /codepage:65001 "/out:$env:RUNNER_TEMP\SonyIsoTests.exe" local/windows/SonyIso.cs local/windows/Wpd.cs tests/windows/SonyIsoTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\SonyIsoTests.exe"
      - name: Lokale Anwendung über den Windows-Starter öffnen
        shell: pwsh
        run: |
          $process = Start-Process cmd.exe -ArgumentList '/d /c Start-Kamera.cmd' -PassThru
          try {
            $session = $null
            for ($i = 0; $i -lt 20; $i++) {
              if ($process.HasExited) { throw "Der Windows-Starter wurde vorzeitig beendet." }
              try {
                $session = Invoke-RestMethod 'http://127.0.0.1:8765/api/session' -TimeoutSec 2
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($session.token -notmatch '^[a-f0-9]{64}$') { throw "Lokale Sitzung fehlt." }
          } finally {
            if (!$process.HasExited) { taskkill.exe /PID $process.Id /T /F }
          }
